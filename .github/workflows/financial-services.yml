name: Cedar financial services
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  financial-services:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - uses: ./.github/actions/setup-verification
      with:
        rust: 'true'
        cvc5: 'true'
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      with:
        bun-version: 1.3.11
    - run: bun install --frozen-lockfile --ignore-scripts
      working-directory: dev
    - run: just example aws financial-services lakehouse
    - run: just example aws financial-services multi-account-banking
    - run: just example aws financial-services claim-settlement
    - run: just example aws financial-services reconciliation
    - run: just check-payment-delta
    - run: just check-payment-interaction
    - run: just check-payment-audit
    - run: just example enterprise payment wallet-signing
    - run: just example enterprise payment wallet-threat-model
    - run: just check-agentic-ai-commerce-admission
'on':
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
  workflow_dispatch: null
