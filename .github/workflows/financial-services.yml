name: Cedar financial services
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  financial-services:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - uses: ./.github/actions/setup-verification
      with:
        rust: 'true'
        cvc5: 'true'
    - run: just example aws financial-services lakehouse
    - run: just example aws financial-services multi-account-banking
    - run: just example aws financial-services claim-settlement
    - run: just example aws financial-services reconciliation
    - run: just check-payment-delta
    - run: just check-payment-interaction
    - run: just check-payment-audit
    - run: just check-agentic-ai-commerce-admission
'on':
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
  workflow_dispatch: null
