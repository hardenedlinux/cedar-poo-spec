name: Cedar platforms and agent integration
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  platforms:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - uses: ./.github/actions/setup-verification
      with:
        rust: 'true'
    - run: just example aws agentic-platform expense
    - run: just example enterprise agent cross-agent-egress
    - run: just example enterprise agent department-synthesis
    - run: just example cloud pipeline-google-threat
    - run: just example cloud pipeline-google-deployment
    - run: just example cloud data-protection-google-sdp
'on':
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
  workflow_dispatch: null
