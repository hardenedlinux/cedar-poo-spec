name: Cedar core
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - uses: ./.github/actions/setup-verification
      with:
        rust: 'false'
    - run: uv run --project python --package cedar-poo-py-test --locked python -m unittest discover -s python/tests
        -v
    - run: just check-lean
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
      with:
        components: rustfmt, clippy
    - uses: taiki-e/install-action@b6a061addd82b81aaeca51bdf2c53cd707996e5a
    - name: Restore Cargo cache
      uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c
      with:
        workspaces: . -> rust/target
    - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
    - run: just check-lean-layers
    - run: just check-rust
'on':
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
  workflow_dispatch: null
