name: Cedar governance
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  governance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - uses: ./.github/actions/setup-verification
      with:
        rust: 'true'
    - run: just example governance country-approval-validated
    - run: just example governance attested-views
    - run: just check-attested-schema-evolution
    - run: just check-mission-comparison
    - run: just check-personnel-governance
'on':
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
  workflow_dispatch: null
