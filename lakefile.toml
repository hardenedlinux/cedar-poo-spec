name = "CedarPooSpec"
version = "0.1.0"
defaultTargets = ["CedarPooSpec"]
# Use Lake's toolchain-owned, input-indexed cache; retain normal artifact paths.
enableArtifactCache = true
restoreAllArtifacts = true

[[require]]
name = "Cedar"
git = { url = "https://github.com/cedar-policy/cedar-spec.git", subDir = "cedar-lean" }
rev = "ac201c127d31cff4bea784c87d3e3d3e8fb8bfe9"

[[require]]
name = "LeanPoo"
git = "https://github.com/tao3k/lean-poo.git"
rev = "v0.1.2"

[[lean_lib]]
name = "CedarPooSpec"

[[lean_lib]]
name = "Examples"
roots = ["Examples"]
globs = ["Examples.+"]

[[lean_lib]]
name = "Productions"
roots = ["Productions"]
globs = ["Productions.+"]

[[lean_lib]]
name = "Tests"
roots = ["Tests"]
globs = ["Tests.+"]

[[lean_exe]]
name = "policyReuseNative"
root = "Benchmarks.PolicyReuse"

[[lean_exe]]
name = "functionalReuseNative"
root = "Benchmarks.FunctionalReuse"

[[lean_exe]]
name = "objectProfilesNative"
root = "Tests.Functional.ProfilesMain"

[[lean_exe]]
name = "caseManifestsNative"
root = "Examples.Manifests"

# Only the diagnostic executable imports this initialization observer.
[[lean_lib]]
name = "Benchmarks"
roots = ["Benchmarks.ManifestInitialization", "Benchmarks.CatalogLifecycle"]
globs = ["Benchmarks.ManifestInitialization", "Benchmarks.CatalogLifecycle"]

[[lean_exe]]
name = "manifestLifecycleNative"
root = "Benchmarks.ManifestLifecycle"
